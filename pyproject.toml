[project]
name = "fitness-metrics"
version = "0.1.0"
description = "Personal WHOOP + Strava analytics pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "authlib>=1.3",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "fitparse>=1.2",
    "platformdirs>=4.2",
]

[project.scripts]
fm = "fitness_metrics.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_metrics"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
